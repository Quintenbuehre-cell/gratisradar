name: GratisRadar

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Alleen testmelding sturen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gratisradar

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Radar draaien
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTCODE: ${{ secrets.POSTCODE }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python3 gratisradar.py --test-melding
          else
            python3 gratisradar.py --eenmalig
          fi

      - name: Onthouden wat al gezien is
        run: |
          [ -f gezien.json ] || exit 0
          git config user.name "gratisradar"
          git config user.email "gratisradar@users.noreply.github.com"
          git add gezien.json
          git diff --cached --quiet && exit 0
          git commit -m "gezien bijwerken [skip ci]"
          git pull --rebase -X theirs || true
          git push
